name: Refresh readiness dashboard

on:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    - cron: "0 6 * * *"     # daily, 06:00 UTC — a daily trend line is the point
  push:
    branches: [main]
    paths:
      - "elysium_qa/**"
      - "config/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests PyYAML

      - name: ABI encoder self-test
        run: python3 -m elysium_qa abi

      - name: Probe ecosystem and rebuild dashboard
        run: python3 scripts/build_static.py

      - name: Commit refreshed artifact
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html out/report.json out/report.md out/raw.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh readiness report [skip ci]"
            git push
          fi
