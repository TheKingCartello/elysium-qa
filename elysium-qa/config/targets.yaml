# ---------------------------------------------------------------------------
# Elysium ecosystem test surface
# Populated 25 Oct 2026 from: Kinetiq ecosystem page, project domains verified
# by anonymous HTTP probe, chain 99801 RPC.
#
# HOW TO EXTEND (this is the whole point of the file):
#   1. under a project, add `contracts:` entries once the team publishes an
#      address book (or you read them off the app's own network tab)
#   2. add a `scenarios:` block to replay a full lifecycle as a regression test
# Anything left blank is itself a finding -- "no published address" is the
# reason nobody can test them before mainnet.
# ---------------------------------------------------------------------------

network:
  name: Elysium Testnet
  chain_id: 99801
  rpc: https://testnet-rpc.elysium.kinetiq.xyz
  explorer: https://elysium.kinetiq.xyz/testnet-explorer
  faucet: https://elysium.kinetiq.xyz/testnet-faucet
  parent_chain: "HyperEVM testnet (998)"
  gas_token: HYPE

sample_blocks: 60
blocktime_window_s: 8

# chain-level / infrastructure deployments (verified on-chain)
contracts:
  - project: _infra
    label: WHYPE (bridged gas token)
    address: "0xCD57F65c2B0e5881CFC2E609F7CD53b746E1F234"
  - project: _infra
    label: Multicall3
    address: "0xcA11bde05977b3631167028862bE2a173976CA11"

