# ---------------------------------------------------------------------------
# Lifecycle scenarios. Record each step once from the app's network tab, then
# the harness replays it forever as a regression test.
#
#   - project: Ascend
#     name: launch -> curve -> graduate -> trade
#     steps:
#       - note: create token
#         to: "0x…"
#         data: "0x…"
#         value_hype: 0
#       - note: buy on bonding curve
#         to: "0x…"
#         data: "0x…"
# ---------------------------------------------------------------------------
scenarios:
  # Safe, zero-risk demo of the ABI + execution pipeline: view calls against
  # WHYPE. Proves signature -> calldata -> eth_call/estimateGas works, and costs
  # nothing even with --execute.
  - project: _infra
    name: "WHYPE interface smoke test (view calls only)"
    steps:
      - note: balanceOf(qa wallet)
        to: "0xCD57F65c2B0e5881CFC2E609F7CD53b746E1F234"
        function: "balanceOf(address)"
        args: ["0x0000000000000000000000000000000000000001"]
      - note: totalSupply
        to: "0xCD57F65c2B0e5881CFC2E609F7CD53b746E1F234"
        function: "totalSupply()"
        args: []
      - note: decimals
        to: "0xCD57F65c2B0e5881CFC2E609F7CD53b746E1F234"
        function: "decimals()"
        args: []

